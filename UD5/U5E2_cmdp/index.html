<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Frame</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/U5E2_cmdp.js" defer></script>
</head>
<body>
    <h1>Digital frame</h1>
    <div class="container">
        <div class="logos">
            <img src="img/html_logo.png" alt="Logo Html5" class="imgHtml">
            <img src="img/bootstrap-logo.jpg" alt="Logo Bootstrap" class="imgBoststrap">
            <img src="img/js.png" alt="Logo js" class="imgJs">
        </div>
        <div class="seccionimagenes">
            <img src="img/html_logo.png" alt="" height="80">
        </div>
        <div class="lupas">
            <img src="img/zoom-in.png" alt="Lupa para hacer zoom" id="zoom-in" width="150">
            <img src="img/zoom-out.png" alt="Lupa para hacer zoom" id="zoom-out" width="150" >
        </div>
    </div>
    <div class="containerColores">
        <div class="cambiarColor" id="negro"></div>
        <div class="cambiarColor" id="rojo"></div>
        <div class="cambiarColor" id="azul"></div>
        <div class="cambiarColor" id="amarillo"></div>
        <div class="cambiarColor" id="verde"></div>
        <div class="cambiarColor" id="rosa"></div>
    </div>
    
    
</body>

</html>
